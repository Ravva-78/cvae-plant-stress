name: CI / Production Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 utils webapp demo.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning exit-zero for style consistency
          flake8 utils webapp demo.py --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Pytest Test Suite
        run: |
          pytest -v --cov=utils --cov=webapp --cov-report=xml --cov-report=term-missing

      - name: Verify Zero-Setup Demo Pass
        run: |
          python demo.py --test-run

      - name: Run Full CLI Demo Benchmark
        run: |
          python demo.py
