<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Block Gradients -->
    <linearGradient id="input-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="enc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <linearGradient id="latent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <linearGradient id="dec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <linearGradient id="anomaly-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1100" height="560" fill="url(#bg-arch)" rx="12" />
  
  <!-- Header Bar -->
  <text x="50" y="45" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
    CVAE System Architecture: Conditional Generative Encoder-Decoder &amp; Anomaly Engine
  </text>
  <text x="50" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    End-to-End Latent Variable Conditioning &amp; Mean Squared Reconstruction Error Classification
  </text>

  <!-- ──────────────── Stage 1: Inputs ──────────────── -->
  <g transform="translate(45, 110)" filter="url(#shadow)">
    <!-- Input Image -->
    <rect x="0" y="0" width="160" height="130" rx="10" fill="url(#input-grad)" stroke="#059669" stroke-width="1.5" />
    <text x="16" y="28" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="700">INPUT LEAF (x)</text>
    <text x="16" y="55" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">RGB Image</text>
    <text x="16" y="75" fill="#cbd5e1" font-family="sans-serif" font-size="12">64 × 64 × 3</text>
    <rect x="16" y="92" width="128" height="22" rx="4" fill="#065f46" />
    <text x="24" y="107" fill="#ecfdf5" font-family="monospace" font-size="10">Dim: 12,288</text>

    <!-- Conditioning Vector -->
    <rect x="0" y="150" width="160" height="95" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="16" y="175" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="700">CONDITION (y)</text>
    <text x="16" y="198" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">One-Hot Label</text>
    <text x="16" y="222" fill="#cbd5e1" font-family="monospace" font-size="11">y ∈ {0, 1}² (2)</text>
  </g>

  <!-- Concat Node 1 -->
  <g transform="translate(235, 210)">
    <circle cx="16" cy="16" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="10" y="22" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="700">⊕</text>
    <text x="-12" y="48" fill="#94a3b8" font-family="monospace" font-size="10">[x, y] : 12,290</text>
  </g>

  <!-- Arrows from Inputs to Concat -->
  <path d="M 205 175 L 235 220" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 205 245 L 235 230" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- ──────────────── Stage 2: Encoder ──────────────── -->
  <g transform="translate(320, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="150" height="190" rx="10" fill="url(#enc-grad)" stroke="#2563eb" stroke-width="1.5" />
    <text x="16" y="28" fill="#bfdbfe" font-family="sans-serif" font-size="11" font-weight="700">ENCODER q_φ</text>
    <text x="16" y="58" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Linear FC1</text>
    <text x="16" y="78" fill="#93c5fd" font-family="monospace" font-size="11">12,290 → 512</text>
    <text x="16" y="96" fill="#cbd5e1" font-family="sans-serif" font-size="11">+ ReLU Activation</text>

    <!-- Dual Output Heads -->
    <rect x="12" y="115" width="126" height="28" rx="5" fill="#1d4ed8" />
    <text x="20" y="133" fill="#ffffff" font-family="monospace" font-size="11">fc_μ: 512 → 50</text>

    <rect x="12" y="148" width="126" height="28" rx="5" fill="#1d4ed8" />
    <text x="20" y="166" fill="#ffffff" font-family="monospace" font-size="11">fc_logvar: 50</text>
  </g>

  <!-- Arrow Concat to Encoder -->
  <path d="M 267 226 L 320 226" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- ──────────────── Stage 3: Reparameterization Bottleneck ──────────────── -->
  <g transform="translate(515, 125)" filter="url(#shadow)">
    <rect x="0" y="0" width="165" height="200" rx="10" fill="url(#latent-grad)" stroke="#9333ea" stroke-width="1.5" />
    <text x="16" y="28" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="700">LATENT BOTTLENECK</text>
    <text x="16" y="55" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Reparameterization</text>
    <text x="16" y="78" fill="#c084fc" font-family="monospace" font-size="11">z = μ + σ ⊙ ε</text>
    <text x="16" y="96" fill="#e2e8f0" font-family="monospace" font-size="11">ε ~ N(0, I)</text>

    <!-- Gaussian Manifold Graphic -->
    <path d="M 20 160 Q 82 110, 145 160" stroke="#a855f7" stroke-width="2" fill="none" />
    <circle cx="82" cy="135" r="4" fill="#38bdf8" />
    <text x="24" y="185" fill="#d8b4fe" font-family="sans-serif" font-size="11">Latent Vector z ∈ ℝ⁵⁰</text>
  </g>

  <!-- Arrow Encoder to Latent -->
  <path d="M 470 225 L 515 225" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Concat Node 2 for Decoder -->
  <g transform="translate(710, 210)">
    <circle cx="16" cy="16" r="16" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <text x="10" y="22" fill="#a855f7" font-family="sans-serif" font-size="18" font-weight="700">⊕</text>
    <text x="-6" y="48" fill="#94a3b8" font-family="monospace" font-size="10">[z, y] : 52</text>
  </g>
  <path d="M 680 225 L 710 225" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <!-- Feeding y into Decoder Concat -->
  <path d="M 125 245 C 125 350, 726 350, 726 242" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrow)" />

  <!-- ──────────────── Stage 4: Decoder ──────────────── -->
  <g transform="translate(770, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="145" height="190" rx="10" fill="url(#dec-grad)" stroke="#2563eb" stroke-width="1.5" />
    <text x="16" y="28" fill="#bfdbfe" font-family="sans-serif" font-size="11" font-weight="700">DECODER p_θ</text>
    <text x="16" y="58" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Linear FC2</text>
    <text x="16" y="78" fill="#93c5fd" font-family="monospace" font-size="11">52 → 512 + ReLU</text>
    
    <text x="16" y="112" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Linear FC3</text>
    <text x="16" y="132" fill="#93c5fd" font-family="monospace" font-size="11">512 → 12,288</text>
    <text x="16" y="152" fill="#cbd5e1" font-family="sans-serif" font-size="11">+ Sigmoid</text>
    <text x="16" y="174" fill="#a7f3d0" font-family="monospace" font-size="11">Output x̂ ∈ [0, 1]</text>
  </g>

  <path d="M 742 226 L 770 226" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- ──────────────── Stage 5: Anomaly Decision Engine ──────────────── -->
  <g transform="translate(945, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="135" height="210" rx="10" fill="url(#anomaly-grad)" stroke="#dc2626" stroke-width="1.5" />
    <text x="12" y="26" fill="#fecaca" font-family="sans-serif" font-size="10" font-weight="700">ANOMALY SCORER</text>
    <text x="12" y="50" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">MSE Loss</text>
    <text x="12" y="70" fill="#fca5a5" font-family="monospace" font-size="10">E = ‖x - x̂‖²</text>
    
    <!-- Threshold block -->
    <rect x="10" y="90" width="115" height="40" rx="5" fill="#991b1b" />
    <text x="16" y="108" fill="#fee2e2" font-family="monospace" font-size="10">τ = 0.014188</text>
    <text x="16" y="122" fill="#fecaca" font-family="sans-serif" font-size="9">Midpoint Cutoff</text>

    <!-- Outcomes -->
    <rect x="10" y="138" width="115" height="28" rx="4" fill="#14532d" />
    <text x="16" y="156" fill="#86efac" font-family="sans-serif" font-size="11" font-weight="bold">E ≤ τ → Healthy</text>

    <rect x="10" y="172" width="115" height="28" rx="4" fill="#7f1d1d" />
    <text x="16" y="190" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold">E &gt; τ → Stressed</text>
  </g>

  <path d="M 915 225 L 945 225" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- ──────────────── Bottom Training Objective Bar ──────────────── -->
  <g transform="translate(45, 400)">
    <rect x="0" y="0" width="1035" height="120" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <text x="24" y="30" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.05em">OBJECTIVE FUNCTION &amp; LOSS OPTIMIZATION</text>
    
    <text x="24" y="62" fill="#f8fafc" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold">
      L(θ, φ; x, y) = - 𝔼_q_φ(z|x, y)[ log p_θ(x|z, y) ] + D_KL( q_φ(z|x, y) ‖ p(z|y) )
    </text>

    <text x="24" y="95" fill="#94a3b8" font-family="sans-serif" font-size="12">
      • <tspan fill="#e2e8f0" font-weight="600">Reconstruction Loss:</tspan> Binary Cross-Entropy between Bernoulli decoded pixels &amp; ground-truth leaf pixels
    </text>
    <text x="560" y="95" fill="#94a3b8" font-family="sans-serif" font-size="12">
      • <tspan fill="#e2e8f0" font-weight="600">Regularization:</tspan> Closed-form KL Divergence against standard Gaussian N(0, I)
    </text>
  </g>
</svg>
