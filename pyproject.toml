[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvae-plant-stress"
version = "1.0.0"
description = "Conditional Variational Autoencoder (CVAE) for Plant Anomaly Phenotyping and Abiotic Stress Detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ravva-78", email = "ravvanagarjun@gmail.com" }
]
keywords = [
    "deep-learning",
    "computer-vision",
    "cvae",
    "variational-autoencoder",
    "anomaly-detection",
    "plant-phenotyping",
    "pytorch",
    "smart-agriculture"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "datasets>=2.14.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "Pillow>=9.5.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.0.0",
    "black>=23.3.0",
]

[project.urls]
"Homepage" = "https://github.com/Ravva-78/cvae-plant-stress"
"Repository" = "https://github.com/Ravva-78/cvae-plant-stress.git"
"Bug Tracker" = "https://github.com/Ravva-78/cvae-plant-stress/issues"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["utils", "webapp"]
omit = [
    "tests/*",
    "scripts/*",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
